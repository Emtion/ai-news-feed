name: Daily AI podcast

on:
  schedule:
    - cron: "30 0 * * *"   # 每天 08:30 (Asia/Shanghai) 自动生成一期
  workflow_dispatch:        # 也可以在 Actions 页面手动点 Run workflow 立即出一期

permissions:
  contents: write
  models: read              # GitHub Models 免费额度需要这个权限

jobs:
  podcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install edge-tts
      - name: Refresh news feed
        run: python aggregator.py
      - name: Generate podcast episode
        env:
          # 写稿模型优先级：GitHub Models（免费，用 Actions 自带 token）-> DeepSeek（Secrets 里的 key）-> 标题播报稿
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python podcast_gen.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily podcast"
          git push
