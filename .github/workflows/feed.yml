name: Update AI news feed

on:
  schedule:
    - cron: "17 * * * *"   # 每小时第 17 分钟跑一次（GitHub 定时任务可能延迟几分钟，属正常）
  workflow_dispatch: {}    # 也可在 Actions 页手动点 Run workflow 立即更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aggregator
        run: python aggregator.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update feed $(date -u +%FT%TZ)"
            git push
          fi
